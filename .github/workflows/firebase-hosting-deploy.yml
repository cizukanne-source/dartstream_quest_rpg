name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          INTELLITOGGLE_API_URL: ${{ secrets.INTELLITOGGLE_API_URL }}
          INTELLITOGGLE_CLIENT_ID: ${{ secrets.INTELLITOGGLE_CLIENT_ID }}
          INTELLITOGGLE_CLIENT_SECRET: ${{ secrets.INTELLITOGGLE_CLIENT_SECRET }}
          INTELLITOGGLE_TENANT_ID: ${{ secrets.INTELLITOGGLE_TENANT_ID }}
        run: |
          flutter build web --release \
            "--dart-define=FIREBASE_API_KEY=${FIREBASE_WEB_API_KEY}" \
            "--dart-define=INTELLITOGGLE_API_URL=${INTELLITOGGLE_API_URL:-https://dev-api.intellitoggle.com}" \
            "--dart-define=INTELLITOGGLE_CLIENT_ID=${INTELLITOGGLE_CLIENT_ID}" \
            "--dart-define=INTELLITOGGLE_CLIENT_SECRET=${INTELLITOGGLE_CLIENT_SECRET}" \
            "--dart-define=INTELLITOGGLE_TENANT_ID=${INTELLITOGGLE_TENANT_ID}"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Missing FIREBASE_TOKEN secret."
            exit 1
          fi

          firebase deploy \
            --project aortem-sample-apps \
            --only hosting \
            --token "$FIREBASE_TOKEN"

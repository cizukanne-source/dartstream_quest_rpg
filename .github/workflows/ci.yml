name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: analyze smoke + dartstream validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: flutter pub get
      - run: dart analyze bin
      - run: dart pub global activate ds_dartstream 0.0.8
      - run: dartstream validate --strict

  client:
    name: analyze + build Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --dart-define=FIREBASE_API_KEY=dummy
